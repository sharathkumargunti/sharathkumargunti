# Deploys the live site. Runs when you push to main, every 6 hours (so edits made in the
# admin panel always go live), and when you press "Deploy site" in the admin panel
# (or "Run workflow" on the Actions tab of GitHub).

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: hosting-live
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-site
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHARATHKUMARGUNTI_E14EA }}
          channelId: live
          projectId: sharathkumargunti-e14ea
