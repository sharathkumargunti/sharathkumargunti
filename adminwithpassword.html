<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin | Sharath Kumar Gunti</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<!-- Tip: add integrity="sha384-..." crossorigin="anonymous" to these 5 CDN tags using the openssl command shared earlier -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.5.0/dist/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
  try {
    const t = localStorage.getItem('theme');
    if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark-mode');
    }
  } catch (e) {}
</script>
<style>
/* ---------- tokens ---------- */
:root {
  color-scheme: light;
  --bg: #f9fafb;
  --surface: #ffffff;
  --nav-glass: rgba(255, 255, 255, 0.78);
  --text: #111827;
  --muted: #6b7280;
  --border: #e5e7eb;
  --soft: #f3f4f6;
  --accent: #111827;
  --on-accent: #ffffff;
  --danger: #ef4444;
  --danger-soft: #fef2f2;
  --warn: #fffbeb;
  --warn-border: #fde68a;
  --warn-text: #92400e;
  --shadow: 0 4px 20px rgba(0, 0, 0, .05);
  --r: 16px;
  --nav-h: 64px;
}

html.dark-mode {
  color-scheme: dark;
  --bg: #121212;
  --surface: #1e1e1e;
  --nav-glass: rgba(24, 24, 24, 0.78);
  --text: #f9fafb;
  --muted: #9ca3af;
  --border: #374151;
  --soft: #2a2a2a;
  --accent: #f9fafb;
  --on-accent: #111827;
  --danger: #f87171;
  --danger-soft: rgba(239, 68, 68, 0.12);
  --warn: rgba(245, 158, 11, 0.12);
  --warn-border: rgba(245, 158, 11, 0.35);
  --warn-text: #fbbf24;
  --shadow: 0 4px 20px rgba(0, 0, 0, .35);
}

/* ---------- base ---------- */
* { margin: 0; padding: 0; box-sizing: border-box; }
[hidden] { display: none !important; }
html { overflow-y: scroll; }
body {
  background: var(--bg);
  color: var(--text);
  font: 400 1rem/1.5 Inter, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  transition: background 0.3s, color 0.3s;
}
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
a { color: inherit; text-decoration: none; }
.wrap { max-width: 1060px; margin: 0 auto; padding: 24px 20px 80px; }

/* ---------- layout helpers ---------- */
.stack { display: grid; gap: 16px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.acts { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.end { justify-content: flex-end; margin-top: 24px; }

/* ---------- typography ---------- */
h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -.5px; }
h2 { font-size: 1.2rem; font-weight: 800; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.top h2 { margin-bottom: 0; }
.meta { color: var(--muted); font-size: .85rem; }
.badge { background: var(--danger); color: #fff; border-radius: 99px; font-size: .7rem; padding: 2px 8px; font-weight: 600; }

/* ---------- inputs & buttons ---------- */
input:not([type="file"]), select, textarea {
  width: 100%;
  font: .95rem Inter, sans-serif;
  padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  color: var(--text);
  transition: all .2s;
  box-shadow: 0 1px 2px rgba(0,0,0,.02);
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--text);
  box-shadow: 0 0 0 3px var(--soft);
}
button, .btn {
  font: 500 .9rem Inter, sans-serif;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  height: 40px;
  padding: 0 16px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  white-space: nowrap;
  transition: all .2s;
  box-shadow: 0 1px 2px rgba(0,0,0,.02);
}
button:hover, .btn:hover { background: var(--soft); border-color: var(--muted); }
button.sm, .btn.sm { height: 34px; padding: 0 12px; font-size: .82rem; border-radius: 10px; }
button.primary, .btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
button.primary:hover, .btn.primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,0,0,.12); opacity: .95; }
button.danger, .btn.danger { color: var(--danger); background: var(--danger-soft); border-color: transparent; }
button.danger:hover, .btn.danger:hover { background: var(--danger); color: #fff; }
button.icon-btn, a.icon-btn { width: 40px; height: 40px; padding: 0; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); display: inline-grid; place-items: center; }
button.icon-btn:hover, a.icon-btn:hover { background: var(--soft); transform: translateY(-1px); border-color: var(--muted); }
button.link { border: none; background: transparent; color: var(--muted); box-shadow: none; height: auto; padding: 4px; font-size: .85rem; }
button.link:hover { color: var(--text); text-decoration: underline; background: transparent; }
button[aria-pressed="true"]:not([data-tab]) { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: not-allowed; transform: none !important; }

/* ---------- top navigation (Frosted Glass) ---------- */
.app-nav {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--nav-glass);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  height: var(--nav-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
}
.nav-brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 1.1rem; letter-spacing: -.5px; }
.logo { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-size: .9rem; font-weight: 800; }
.nav-tabs { display: flex; gap: 6px; background: var(--soft); padding: 4px; border-radius: 14px; }
.nav-tabs button { height: 34px; padding: 0 16px; border: none; background: transparent; color: var(--muted); border-radius: 10px; font-weight: 600; font-size: .85rem; box-shadow: none; }
.nav-tabs button:hover { color: var(--text); }
.nav-tabs button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 2px 6px rgba(0,0,0,.06); }
.nav-acts { display: flex; align-items: center; gap: 10px; }

/* ---------- auth ---------- */
.boot { display: grid; place-items: center; min-height: 60vh; }
.spin { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--text); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#auth { max-width: 400px; margin: 12vh auto 0; background: var(--surface); padding: 32px; border-radius: var(--r); border: 1px solid var(--border); box-shadow: var(--shadow); }
#auth .brand { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 24px; }
.pw { position: relative; }
.pw input { padding-right: 48px; }
.pw button { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: 0; background: none; height: 28px; width: 32px; padding: 0; color: var(--muted); box-shadow: none; }
.err { color: var(--danger); font-size: .85rem; text-align: center; }

/* ---------- editor studio ---------- */
#editing {
  background: var(--warn);
  border: 1px solid var(--warn-border);
  color: var(--warn-text);
  padding: 12px 18px;
  border-radius: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  font-size: .9rem;
  font-weight: 500;
  margin-bottom: 16px;
}

.editor-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
}
.editor-header { padding: 24px 24px 18px; border-bottom: 1px solid var(--border); }
.title-input {
  font: 800 2.1rem/1.2 Inter, sans-serif;
  letter-spacing: -1px;
  border: none !important;
  padding: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
  border-radius: 0 !important;
}
.title-input::placeholder { color: var(--muted); opacity: .45; }

/* Multi-Tag Pill Bar */
.meta-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 16px;
  align-items: center;
}
.meta-label {
  font-size: .78rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: var(--muted);
  margin-right: 4px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.tag-pills { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag-pill {
  height: 30px;
  padding: 0 12px;
  border-radius: 99px;
  font-size: .8rem;
  font-weight: 600;
  background: var(--soft);
  color: var(--muted);
  border: 1px solid transparent;
  box-shadow: none;
}
.tag-pill:hover { color: var(--text); border-color: var(--border); }
.tag-pill.active {
  background: var(--accent);
  color: var(--on-accent);
  border-color: var(--accent);
}
.tag-pill.add-tag-btn {
  background: transparent;
  border: 1px dashed var(--border);
  color: var(--muted);
}
.tag-pill.add-tag-btn:hover { border-color: var(--text); color: var(--text); }

/* Sticky Toolbar */
.tool {
  position: sticky;
  top: var(--nav-h);
  z-index: 30;
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  align-items: center;
  padding: 10px 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.tool button {
  height: 32px;
  padding: 0 10px;
  border: none;
  background: var(--soft);
  font-size: .82rem;
  border-radius: 8px;
  box-shadow: none;
}
.tool button:hover { background: var(--border); }
.tool button.primary { background: var(--accent); color: var(--on-accent); }
.tool button i { font-size: .85rem; }
.tool .push { margin-left: auto; }
.sep { width: 1px; height: 18px; background: var(--border); margin: 0 3px; }

/* Section Outline Dropdown in Toolbar */
.outline-dropdown { position: relative; }
.outline-dropdown > summary {
  list-style: none;
  cursor: pointer;
  height: 32px;
  padding: 0 10px;
  border-radius: 8px;
  background: var(--soft);
  color: var(--text);
  font-size: .82rem;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.outline-dropdown > summary::-webkit-details-marker { display: none; }
.outline-dropdown > summary:hover { background: var(--border); }
.outline-menu {
  position: absolute;
  left: 0;
  top: calc(100% + 6px);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,.15);
  padding: 6px;
  min-width: 220px;
  max-width: 300px;
  max-height: 280px;
  overflow-y: auto;
  z-index: 60;
  display: grid;
  gap: 2px;
}
.outline-menu button {
  width: 100%;
  justify-content: flex-start;
  height: auto;
  min-height: 32px;
  padding: 6px 10px;
  background: transparent;
  border: none;
  font-size: .82rem;
  text-align: left;
  white-space: normal;
  line-height: 1.3;
}
.outline-menu button.h3-item { padding-left: 22px; color: var(--muted); font-size: .78rem; }
.outline-menu button:hover { background: var(--soft); color: var(--text); }
.outline-empty { padding: 10px 12px; font-size: .8rem; color: var(--muted); text-align: center; }

/* Workspace & Split View */
.workspace { display: flex; flex-direction: column; min-height: 540px; }
.workspace.split { flex-direction: row; align-items: stretch; }
.workspace > * { flex: 1; min-width: 0; }
textarea#content {
  min-height: 540px;
  resize: none;
  border: none !important;
  border-radius: 0 !important;
  padding: 28px 24px;
  font: .98rem/1.75 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  box-shadow: none !important;
  tab-size: 2;
}
.workspace.split textarea#content {
  border-right: 1px solid var(--border) !important;
  max-height: 78vh;
  overflow-y: auto !important;
}
#preview {
  padding: 28px 28px;
  max-height: 78vh;
  overflow-y: auto;
  background: var(--bg);
}

.editor-footer {
  position: sticky;
  bottom: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 24px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  border-radius: 0 0 var(--r) var(--r);
  z-index: 20;
}

/* Zen Focus Mode */
body.zen-mode { padding: 0; background: var(--surface); }
body.zen-mode .app-nav { display: none; }
body.zen-mode .wrap { max-width: 1280px; padding: 0; }
body.zen-mode #editing { margin: 0; border-radius: 0; border-left: none; border-right: none; }
body.zen-mode .editor-card { border-radius: 0; border: none; box-shadow: none; min-height: 100vh; }
body.zen-mode .editor-header { max-width: 860px; width: 100%; margin: 0 auto; padding-top: 36px; }
body.zen-mode .workspace:not(.split) textarea#content { max-width: 860px; width: 100%; margin: 0 auto; font-size: 1.06rem; line-height: 1.85; }
body.zen-mode .tool { top: 0; justify-content: center; }
body.zen-mode .tool .push { margin-left: 16px; }

/* Preview Typography (Matched to notes.html) */
.atags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.atag { display: inline-block; background: var(--soft); border: 1px solid var(--border); padding: 4px 12px; border-radius: 6px; font-size: .75rem; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; }
.atitle { font-size: 2.3rem; font-weight: 800; line-height: 1.18; letter-spacing: -1px; margin-bottom: 24px; }
.ptoc { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; margin-bottom: 28px; font-family: Inter, sans-serif; }
.ptoc h4 { font-size: .78rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 10px; font-weight: 800; }
.ptoc ul { list-style: none; margin: 0; padding: 0; }
.ptoc li { font-size: .9rem; margin-bottom: 6px; font-weight: 500; }
.ptoc li.sub { padding-left: 16px; font-size: .85rem; color: var(--muted); }
.nbody { font: 1.12rem/1.78 Lora, Georgia, serif; overflow-wrap: anywhere; color: var(--text); }
.nbody p { margin-bottom: 1.5rem; }
.nbody :is(h2, h3) { font-family: Inter, sans-serif; font-weight: 800; letter-spacing: -.5px; margin: 2.4rem 0 1rem; }
.nbody h2 { font-size: 1.6rem; }
.nbody h3 { font-size: 1.3rem; }
.nbody :is(ul, ol) { margin: 0 0 1.5rem 1.5rem; }
.nbody li { margin-bottom: .5rem; padding-left: .4rem; }
.nbody a { text-decoration: underline; text-underline-offset: 4px; }
.nbody blockquote { border-left: 4px solid var(--text); padding: 1rem 1.5rem; font-style: italic; color: var(--muted); margin: 2rem 0; background: var(--surface); border-radius: 0 12px 12px 0; }
.nbody img { max-width: 100%; border-radius: 12px; margin: 1.6rem 0; box-shadow: var(--shadow); }
.nbody pre { margin-bottom: 1.6rem; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); background: #1a1b26; color: #c0caf5; }
.nbody pre code { padding: 1.2rem !important; font: .88rem/1.55 ui-monospace, Menlo, Consolas, monospace; display: block; overflow-x: auto; }
.nbody code:not(pre code) { font: .85em ui-monospace, Menlo, Consolas, monospace; background: var(--soft); padding: 2px 6px; border-radius: 6px; }
.nbody table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; margin-bottom: 1.6rem; font: .9rem/1.5 Inter, sans-serif; background: var(--surface); border-radius: 10px; }
.nbody :is(th, td) { border: 1px solid var(--border); padding: 10px 14px; text-align: left; }
.nbody th { background: var(--soft); font-weight: 600; }

/* ---------- lists & grids ---------- */
.srch-bar { display: flex; gap: 12px; margin-bottom: 24px; align-items: center; flex-wrap: wrap; }
.srch-bar input { flex: 1; min-width: 220px; border-radius: 99px; padding-left: 20px; }
.srch-bar select { flex: 0 0 200px; border-radius: 99px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-bottom: 40px; }

/* cards */
.item-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 22px; display: flex; flex-direction: column; box-shadow: 0 2px 10px rgba(0,0,0,.02); transition: all .2s; }
.item-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--muted); }
.item-card.draft { border-style: dashed; }
.item-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 12px; }
.item-tag { background: var(--soft); padding: 3px 9px; border-radius: 8px; font-size: .7rem; font-weight: 600; color: var(--text); white-space: nowrap; }
.item-title { font-size: 1.12rem; font-weight: 800; line-height: 1.32; color: var(--text); }
.item-preview { font-family: Lora, serif; font-size: .95rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 18px; flex: 1; line-height: 1.55; }
.item-acts { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 14px; margin-top: auto; gap: 8px; }

/* dropdown menu */
.dropdown { position: relative; }
.dropdown > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; border: 1px solid transparent; color: var(--muted); transition: all .2s; }
.dropdown > summary::-webkit-details-marker { display: none; }
.dropdown > summary:hover { background: var(--soft); color: var(--text); border-color: var(--border); }
.dropdown-menu { position: absolute; right: 0; bottom: calc(100% + 8px); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.12); padding: 6px; display: grid; gap: 2px; min-width: 175px; z-index: 50; }
.dark-mode .dropdown-menu { box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.dropdown-menu button { width: 100%; justify-content: flex-start; height: 36px; padding: 0 12px; border: none; background: transparent; font-size: .84rem; font-weight: 500; box-shadow: none; border-radius: 8px; }
.dropdown-menu button i { width: 16px; text-align: center; margin-right: 6px; opacity: .75; }
.dropdown-menu button:hover { background: var(--soft); }
.dropdown-menu button.danger { color: var(--danger); }
.dropdown-menu button.danger:hover { background: var(--danger-soft); color: var(--danger); }

/* messages specific */
.msg-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 22px; box-shadow: 0 2px 10px rgba(0,0,0,.02); transition: all .2s; }
.msg-card.unread { border-left: 4px solid var(--danger); }
.msg-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 12px; }
.msg-name { font-weight: 800; font-size: 1.08rem; display: flex; align-items: center; gap: 8px; }
.msg-name.unread::after { content: ""; display: inline-block; width: 8px; height: 8px; background: var(--danger); border-radius: 50%; }
.msg-body { background: var(--soft); padding: 16px; border-radius: 12px; font-size: .95rem; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; margin-bottom: 16px; color: var(--text); }
.msg-acts { display: flex; justify-content: flex-end; gap: 8px; }

.empty { text-align: center; padding: 48px 20px; color: var(--muted); background: var(--surface); border: 1px dashed var(--border); border-radius: var(--r); grid-column: 1 / -1; }
.empty i { font-size: 2rem; margin-bottom: 12px; opacity: .5; }
.skel { height: 160px; border-radius: var(--r); background: linear-gradient(90deg, var(--surface) 25%, var(--soft) 50%, var(--surface) 75%); background-size: 200% 100%; animation: sh 1.5s linear infinite; border: 1px solid var(--border); }
@keyframes sh { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* ---------- toasts & dialogs ---------- */
#toasts { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; z-index: 100; }
.toast { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-radius: 12px; background: var(--text); color: var(--bg); font-weight: 500; font-size: .9rem; box-shadow: 0 10px 25px rgba(0,0,0,.2); animation: slideUp .3s ease; }
.toast.error { background: var(--danger); color: #fff; }
.toast button { background: rgba(255,255,255,.2); color: inherit; border: none; height: 28px; padding: 0 12px; border-radius: 6px; box-shadow: none; font-size: .82rem; }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

dialog { margin: auto; border: 1px solid var(--border); border-radius: 24px; background: var(--surface); color: var(--text); padding: 28px; width: min(420px, calc(100vw - 32px)); box-shadow: 0 20px 40px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(0,0,0,.5); backdrop-filter: blur(4px); }
dialog .stack { margin-top: 18px; }

@media (max-width: 768px) {
  .workspace.split { flex-direction: column; }
  .workspace.split textarea#content { border-right: none !important; border-bottom: 1px solid var(--border) !important; max-height: none; }
  .nav-title { display: none; }
}
@media (max-width: 600px) {
  .wrap { padding: 16px 12px 80px; }
  .app-nav { padding: 0 14px; }
  .nav-tabs button { padding: 0 12px; }
  .nav-tabs button span:not(.badge) { display: none; }
  .editor-header { padding: 16px; }
  .title-input { font-size: 1.65rem; }
  .tool { padding: 10px 14px; }
  .srch-bar { flex-direction: column; align-items: stretch; }
  .srch-bar select { flex: none; width: 100%; }
  .editor-footer { flex-direction: column; gap: 12px; }
  .editor-footer .meta { order: 2; font-size: 0.8rem; text-align: center; width: 100%; }
  .editor-footer .acts { order: 1; display: flex; width: 100%; gap: 10px; }
  .editor-footer .acts button { flex: 1; margin: 0; }
}
/* ---------- link (slug) + summary fields, contrast fixes ---------- */
.slug-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.slug-field { display: flex; align-items: center; flex: 1; min-width: 220px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); overflow: hidden; }
.slug-field > span { padding-left: 12px; color: var(--muted); font-size: .85rem; white-space: nowrap; }
.slug-field input { border: 0; background: transparent; box-shadow: none; padding: 9px 12px 9px 2px; font: .88rem ui-monospace, Menlo, Consolas, monospace; flex: 1; min-width: 0; }
.slug-field:focus-within { border-color: var(--text); }
.excerpt-input { width: 100%; margin-top: 12px; min-height: 48px; max-height: 120px; resize: vertical; font-size: .92rem; line-height: 1.5; }
.badge { background: #DC2626; }
.toast.error { background: #DC2626; }
</style>
</head>
<body>

<div class="boot" id="boot" role="status" aria-label="Loading"><span class="spin"></span></div>

<form id="auth" hidden>
  <div class="brand"><span class="logo">SK</span><h1>Admin Login</h1></div>
  <div class="stack">
    <input type="email" id="email" placeholder="Email address" autocomplete="username" required>
    <div class="pw">
      <input type="password" id="pass" placeholder="Password" autocomplete="current-password" required>
      <button type="button" id="eye" aria-label="Toggle password visibility"><i class="fas fa-eye"></i></button>
    </div>
    <p class="err" id="lerr" role="alert" hidden></p>
    <button class="primary" id="login">Log in</button>
    <button type="button" class="link" id="forgot">Forgot password?</button>
  </div>
</form>

<div id="app" hidden>
  <nav class="app-nav">
    <div class="nav-brand"><span class="logo">SK</span> <span class="nav-title">Writing Studio</span></div>
    <div class="nav-tabs">
      <button data-tab="write" aria-pressed="true" title="Write"><i class="fas fa-pen-nib"></i> <span>Write</span></button>
      <button data-tab="notes" aria-pressed="false" title="Notes"><i class="fas fa-layer-group"></i> <span>Notes</span> <span class="badge" id="ncount" hidden>0</span></button>
      <button data-tab="msgs" aria-pressed="false" title="Messages"><i class="fas fa-envelope"></i> <span>Inbox</span> <span class="badge" id="unread" hidden>0</span></button>
    </div>
    <div class="nav-acts">
      <a href="/" class="icon-btn" target="_blank" rel="noopener" title="View Public Site"><i class="fas fa-external-link-alt"></i></a>
      <button id="theme-toggle" class="icon-btn" title="Toggle Theme"><i class="fas fa-moon"></i></button>
      <button id="logout" class="icon-btn" title="Log out"><i class="fas fa-sign-out-alt"></i></button>
    </div>
  </nav>

  <div class="wrap" id="main-wrap">
    
    <!-- WRITE TAB -->
    <section id="t-write">
      <div id="editing" hidden>
        <span id="editing-label"></span>
        <button type="button" class="sm" id="cancel-edit"><i class="fas fa-times"></i> Cancel edit</button>
      </div>

      <div class="editor-card">
        <div class="editor-header">
          <input class="title-input" id="title" placeholder="Essay Title..." aria-label="Title" autocomplete="off">
          <div class="meta-row">
            <span class="meta-label"><i class="fas fa-tags"></i> Topics:</span>
            <div class="tag-pills" id="tag-pills"></div>
            <button type="button" class="tag-pill add-tag-btn" id="add-tag-btn" title="Add custom topic">+ Custom</button>
          </div>
          <div class="slug-row">
            <span class="meta-label"><i class="fas fa-link"></i> Link:</span>
            <div class="slug-field"><span>/essays/</span><input id="slug" aria-label="Essay link (slug)" autocomplete="off" spellcheck="false" placeholder="written-from-the-title"></div>
          </div>
          <textarea class="excerpt-input" id="excerpt" rows="2" maxlength="240" placeholder="Short summary for link previews and the notes list (optional; written from your text if left empty)" aria-label="Summary"></textarea>
        </div>

        <div class="tool" id="tool">
          <button type="button" data-md="**|**" title="Bold (Ctrl+B)"><i class="fas fa-bold"></i></button>
          <button type="button" data-md="*|*" title="Italic (Ctrl+I)"><i class="fas fa-italic"></i></button>
          <span class="sep"></span>
          <button type="button" data-md="&#10;## |" title="Heading 2"><strong>H2</strong></button>
          <button type="button" data-md="&#10;### |" title="Heading 3"><strong>H3</strong></button>
          <button type="button" data-md="&#10;> |" title="Blockquote"><i class="fas fa-quote-right"></i></button>
          <button type="button" data-md="&#10;- |" title="Bullet List"><i class="fas fa-list-ul"></i></button>
          <button type="button" data-md="&#10;1. |" title="Numbered List"><i class="fas fa-list-ol"></i></button>
          <span class="sep"></span>
          <button type="button" data-md="[|](https://)" title="Insert Link (Ctrl+K or Paste URL over selected text)"><i class="fas fa-link"></i></button>
          <button type="button" id="img" title="Insert Image"><i class="fas fa-image"></i></button>
          <button type="button" id="tbl" title="Insert Table"><i class="fas fa-table"></i></button>
          <button type="button" data-md="&#10;```&#10;|&#10;```&#10;" title="Code Block"><i class="fas fa-code"></i></button>
          <button type="button" id="hr-btn" title="Horizontal Divider"><i class="fas fa-minus"></i></button>
          <span class="sep"></span>
          <details class="outline-dropdown" id="outline-dropdown">
            <summary title="Jump to section heading"><i class="fas fa-list"></i> Outline</summary>
            <div class="outline-menu" id="outline-menu">
              <div class="outline-empty">Add ## headings to build an outline</div>
            </div>
          </details>
          <button type="button" id="imp" title="Import from Markdown"><i class="fas fa-file-import"></i></button>
          <button type="button" id="exp" title="Export as Markdown"><i class="fas fa-file-export"></i></button>
          
          <button type="button" class="push" id="zen" title="Distraction-Free Focus Mode (Esc to exit)"><i class="fas fa-expand-arrows-alt"></i> Zen</button>
          <button type="button" id="prev" class="primary" title="Toggle Split Preview"><i class="fas fa-columns"></i> Preview</button>
        </div>

        <div class="workspace" id="workspace">
          <textarea id="content" placeholder="Start writing in Markdown... (Tip: Highlight text and paste a URL to auto-link)" aria-label="Note content"></textarea>
          <div id="preview" hidden></div>
        </div>

        <div class="editor-footer">
          <div class="meta"><span id="count">0 words • 1 min read</span> <span id="auto"></span></div>
          <div class="acts">
            <button type="button" id="clear-btn" class="sm" title="Clear editor">Reset</button>
            <button type="button" id="draft" title="Ctrl+S"><i class="fas fa-save"></i> Save Draft</button>
            <button type="button" class="primary" id="pub" title="Ctrl+Enter"><i class="fas fa-paper-plane"></i> Publish</button>
          </div>
        </div>
      </div>
      <input type="file" id="mdfile" accept=".md,.txt,text/markdown,text/plain" hidden>
    </section>

    <!-- NOTES & DRAFTS TAB -->
    <section id="t-notes" hidden>
      <div class="srch-bar">
        <input type="search" id="q" placeholder="Search essays and drafts..." aria-label="Search">
        <select id="tf" aria-label="Filter by tag"></select>
        <button type="button" id="deploy-btn" class="sm" title="Rebuild and publish the public site now (essay pages, sitemap, RSS)"><i class="fas fa-rocket"></i> Deploy site</button>
        <button type="button" id="deploy-cfg" class="sm" title="Set up one-click deploy" aria-label="Deploy settings"><i class="fas fa-gear"></i></button>
      </div>

      <h2><i class="fas fa-file-signature"></i> Drafts <span class="meta" id="dcount"></span></h2>
      <div class="grid" id="drafts">
        <div class="skel"></div><div class="skel"></div>
      </div>

      <h2 style="margin-top: 32px;"><i class="fas fa-book-open"></i> Published <span class="meta" id="pcount"></span></h2>
      <div class="grid" id="published">
        <div class="skel"></div><div class="skel"></div><div class="skel"></div>
      </div>
    </section>

    <!-- MESSAGES INBOX TAB -->
    <section id="t-msgs" hidden>
      <div class="top">
        <h2><i class="fas fa-inbox"></i> Visitor Inbox</h2>
        <div class="acts">
          <button type="button" class="sm" id="unonly" aria-pressed="false">Unread only</button>
          <button type="button" class="sm" id="readall" hidden><i class="fas fa-check-double"></i> Mark all read</button>
          <button type="button" class="icon-btn" id="refresh" title="Refresh"><i class="fas fa-sync-alt"></i></button>
        </div>
      </div>
      <div class="stack" id="msgs">
        <div class="skel"></div>
      </div>
    </section>

  </div>
</div>

<dialog id="dlg">
  <form method="dialog">
    <h2 id="dt"></h2>
    <p class="meta" id="dp"></p>
    <div class="stack" id="df"></div>
    <div class="acts end">
      <button type="button" id="dno">Cancel</button>
      <button id="dyes" value="ok"></button>
    </div>
  </form>
</dialog>
<div id="toasts" role="status" aria-live="polite"></div>

<script type="module">
import { firebaseConfig, SITE } from "/assets/firebase-config.js";
import { ESSAY_PATH, esc, slugify, baseSlug, assignSlugs } from "/assets/util.js";

// One Firebase version for the whole site (see assets/firebase-config.js)
const FB = `https://www.gstatic.com/firebasejs/${SITE.firebaseVersion}`;
const { initializeApp } = await import(`${FB}/firebase-app.js`);
const { getFirestore, collection, doc, addDoc, setDoc, getDocs, updateDoc, deleteDoc, query, orderBy, limit, writeBatch, arrayUnion, serverTimestamp } = await import(`${FB}/firebase-firestore.js`);
const { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut } = await import(`${FB}/firebase-auth.js`);

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);
const auth = getAuth(app);

const DEFAULT_TAGS = ['UPSC CSE', 'Geopolitics', 'Defense', 'Economy', 'AI & Tech', 'Personal'];
const KEY = 'admin-draft';
let slugTouched = false; // true once the link was typed by hand (or loaded from a saved essay)

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const td = t => (t && t.toDate) ? t.toDate() : (t ? new Date(t) : null);
const fmt = t => {
  const d = td(t);
  return (d && !isNaN(d)) ? d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
};
const ago = t => {
  const d = td(t);
  if (!d || isNaN(d)) return '';
  const s = (Date.now() - d.getTime()) / 1000;
  if (s < 60) return 'Just now';
  if (s >= 604800) return fmt(t) || '';
  const [div, unit] = s < 3600 ? [60, 'm'] : s < 86400 ? [3600, 'h'] : [86400, 'd'];
  return `${Math.floor(s / div)}${unit} ago`;
};

const words = s => s.trim().split(/\s+/).filter(Boolean).length;
const paras = s => s.trim() ? s.trim().split(/\n\s*\n/).filter(Boolean).length : 0;
const mins = s => Math.max(1, Math.round(words(s) / 200));

const snippetCache = new Map();
const cleanSnippet = md => {
  if (!md) return '';
  if (snippetCache.has(md)) return snippetCache.get(md);
  const html = DOMPurify.sanitize(marked.parse(String(md)));
  // DOMParser documents are inert: unlike a detached <div>, they never fetch images
  const text = (new DOMParser().parseFromString(html, 'text/html').body.textContent || '').replace(/\s+/g, ' ').trim();
  snippetCache.set(md, text);
  return text;
};

const toast = (m, k = '', a = null) => {
  const d = document.createElement('div');
  d.className = 'toast ' + k;
  d.innerHTML = k === 'error' ? '<i class="fas fa-exclamation-circle"></i> ' : '<i class="fas fa-check-circle"></i> ';
  d.append(m);
  if (a) {
    const b = document.createElement('button');
    b.textContent = a.label;
    b.onclick = () => { d.remove(); a.fn(); };
    d.append(b);
  }
  $('toasts').append(d);
  setTimeout(() => d.remove(), a ? 8000 : 4000);
};

const dlg = $('dlg');
const ask = o => new Promise(res => {
  const fs = o.fields ? o.fields : [];
  $('dt').textContent = o.title;
  $('dp').textContent = o.text ? o.text : '';
  $('df').innerHTML = fs.map(f => `<input id="f-${f.id}" type="${f.type || 'text'}" placeholder="${esc(f.label)}" aria-label="${esc(f.label)}" value="${esc(f.value || '')}" autocomplete="off">`).join('');
  const y = $('dyes');
  y.innerHTML = o.ok ? o.ok : 'OK';
  y.className = o.danger ? 'danger' : 'primary';
  dlg.onclose = () => {
    if (dlg.returnValue === 'ok') {
      res(Object.fromEntries(fs.map(f => [f.id, $('f-' + f.id).value.trim()])));
    } else res(null);
  };
  dlg.returnValue = '';
  dlg.showModal();
});
$('dno').onclick = () => dlg.close();

const errMsg = e => {
  if (e && e.code === 'permission-denied') return 'Access Denied. Check Firebase Rules.';
  return e && e.message ? e.message : 'Something went wrong.';
};

const view = slug => ({ label: 'View', fn: () => open(ESSAY_PATH + '/' + encodeURIComponent(slug), '_blank', 'noopener') });

/* ---------- multi-tag selector ---------- */
let availableTags = [...DEFAULT_TAGS];
let selectedTags = [DEFAULT_TAGS[0]];

function renderTagPills() {
  const box = $('tag-pills');
  box.innerHTML = availableTags.map(t => {
    const isAct = selectedTags.includes(t);
    return `<button type="button" class="tag-pill ${isAct ? 'active' : ''}" data-tag-pill="${esc(t)}">${esc(t)}</button>`;
  }).join('');
}

function setTagsSelection(tagsArr) {
  const clean = (Array.isArray(tagsArr) ? tagsArr : [tagsArr]).map(t => String(t || '').trim()).filter(Boolean);
  clean.forEach(t => {
    if (!availableTags.includes(t)) availableTags.push(t);
  });
  selectedTags = clean.length > 0 ? clean : [DEFAULT_TAGS[0]];
  renderTagPills();
}

$('tag-pills').addEventListener('click', e => {
  const btn = e.target.closest('[data-tag-pill]');
  if (!btn) return;
  const t = btn.dataset.tagPill;
  if (selectedTags.includes(t)) {
    if (selectedTags.length > 1) selectedTags = selectedTags.filter(x => x !== t);
  } else {
    selectedTags.push(t);
  }
  renderTagPills();
  mark();
});

$('add-tag-btn').onclick = async () => {
  const r = await ask({ title: 'Add Custom Topic', text: 'Enter a topic name for this essay:', ok: 'Add Topic', fields: [{ id: 't', label: 'Topic name (e.g., Anthropology)' }] });
  if (!r || !r.t) return;
  const clean = r.t.trim();
  if (!availableTags.includes(clean)) availableTags.push(clean);
  if (!selectedTags.includes(clean)) selectedTags.push(clean);
  renderTagPills();
  mark();
};

renderTagPills();

/* ---------- theme + login ---------- */
const root = document.documentElement;
const themeBtn = $('theme-toggle');
const tIcon = themeBtn.querySelector('i');

const paint = () => {
  const isDark = root.classList.contains('dark-mode');
  tIcon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
  tIcon.style.color = isDark ? '#FFD700' : '';
};
themeBtn.onclick = () => {
  const isDark = root.classList.toggle('dark-mode');
  try { localStorage.setItem('theme', isDark ? 'dark' : 'light'); } catch (e) {}
  paint();
};
paint();

const loginErr = {'auth/too-many-requests':'Too many attempts. Wait a minute.','auth/invalid-email':'Invalid email.','auth/user-disabled':'Account disabled.'};
const badLogin = ['auth/invalid-credential', 'auth/wrong-password', 'auth/user-not-found'];

$('auth').onsubmit = async e => {
  e.preventDefault();
  const b = $('login'); const m = $('lerr');
  m.hidden = true; b.disabled = true; b.textContent = 'Logging in...';
  try {
    await signInWithEmailAndPassword(auth, $('email').value.trim(), $('pass').value);
  } catch (x) {
    m.textContent = loginErr[x.code] ? loginErr[x.code] : (badLogin.includes(x.code) ? 'Wrong credentials.' : 'Login failed.');
    m.hidden = false;
  } finally {
    b.disabled = false; b.textContent = 'Log in';
  }
};

$('eye').onclick = () => {
  const p = $('pass');
  const s = p.type === 'password';
  p.type = s ? 'text' : 'password';
  $('eye').innerHTML = s ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
};

$('forgot').onclick = async () => {
  const emailInput = $('email').value.trim();
  if (!emailInput) return toast('Enter email first, then tap Forgot password.', 'error');
  try {
    await sendPasswordResetEmail(auth, emailInput);
    toast('Reset link sent to inbox.');
  } catch (x) {
    toast(loginErr[x.code] ? loginErr[x.code] : 'Failed to send reset link.', 'error');
  }
};

$('logout').onclick = async () => {
  if (dirty) {
    const confirmation = await ask({ title: 'Log out?', text: 'Unsaved changes will be lost.', ok: 'Log out', danger: true });
    if (!confirmation) return;
  }
  signOut(auth);
};

/* ---------- tabs ---------- */
const tabs = document.querySelectorAll('[data-tab]');
const showTab = n => {
  tabs.forEach(b => b.setAttribute('aria-pressed', b.dataset.tab === n));
  ['write', 'notes', 'msgs'].forEach(t => { $('t-' + t).hidden = t !== n; });
};
tabs.forEach(b => { b.onclick = () => showTab(b.dataset.tab); });

/* ---------- editor ---------- */
const ta = $('content');
const pv = $('preview');
let cur = null, dirty = false, timer, previewTimer;

const resizeTa = () => {
  if ($('workspace').classList.contains('split')) {
    ta.style.height = 'auto';
    return;
  }
  const scrollPos = window.scrollY;
  ta.style.height = 'auto';
  ta.style.height = Math.max(540, ta.scrollHeight + 4) + 'px';
  window.scrollTo({ top: scrollPos, behavior: 'instant' });
};
ta.addEventListener('input', resizeTa);
window.addEventListener('resize', () => {
  if (!pv.hidden) {
    const w = $('workspace');
    if (window.innerWidth >= 768) {
      ta.hidden = false;
      w.classList.add('split');
      $('prev').innerHTML = '<i class="fas fa-eye-slash"></i> Close';
    } else {
      ta.hidden = true;
      w.classList.remove('split');
      $('prev').innerHTML = '<i class="fas fa-edit"></i> Edit';
    }
  }
  resizeTa();
});

// Proportional Scroll Sync in Split Preview Mode
ta.addEventListener('scroll', () => {
  if (pv.hidden || !$('workspace').classList.contains('split')) return;
  const maxTa = ta.scrollHeight - ta.clientHeight;
  const maxPv = pv.scrollHeight - pv.clientHeight;
  if (maxTa > 0 && maxPv > 0) {
    pv.scrollTop = (ta.scrollTop / maxTa) * maxPv;
  }
});

// Build Live Section Outline Menu for quick cursor jumping
function updateOutlineMenu() {
  const menu = $('outline-menu');
  const lines = ta.value.split('\n');
  let pos = 0;
  const items = [];

  lines.forEach(line => {
    const m = line.match(/^(#{2,3})\s+(.+)$/);
    if (m) {
      items.push({ level: m[1].length, text: m[2].trim(), index: pos });
    }
    pos += line.length + 1;
  });

  if (items.length === 0) {
    menu.innerHTML = `<div class="outline-empty">Add ## headings to build an outline</div>`;
    return;
  }

  menu.innerHTML = items.map(it => 
    `<button type="button" class="${it.level === 3 ? 'h3-item' : ''}" data-jump="${it.index}">${esc(it.text)}</button>`
  ).join('');
}

$('outline-menu').addEventListener('click', e => {
  const btn = e.target.closest('[data-jump]');
  if (!btn) return;
  const idx = parseInt(btn.dataset.jump, 10);
  $('outline-dropdown').removeAttribute('open');
  ta.focus();
  ta.setSelectionRange(idx, idx);
  const ratio = idx / Math.max(1, ta.value.length);
  if ($('workspace').classList.contains('split')) {
    ta.scrollTop = ratio * ta.scrollHeight;
  } else {
    const rect = ta.getBoundingClientRect();
    window.scrollTo({ top: window.scrollY + rect.top + (ratio * ta.scrollHeight) - 140, behavior: 'smooth' });
  }
});

const updatePreview = () => {
  if (pv.hidden) return;
  const d = formData();
  const displayTitle = d.title ? d.title : 'Untitled Essay';
  const displayContent = ta.value ? ta.value : '*Start writing to see your live preview...*';
  const tagsHTML = d.tags.length ? `<div class="atags">${d.tags.map(t => `<span class="atag">${esc(t)}</span>`).join('')}</div>` : '';
  
  const temp = document.createElement('div');
  temp.innerHTML = DOMPurify.sanitize(marked.parse(displayContent));
  
  let tocHTML = '';
  const headings = temp.querySelectorAll('h2, h3');
  if (headings.length > 2) {
    tocHTML = `<div class="ptoc"><h4>Table of Contents</h4><ul>` +
      Array.from(headings).map(h => `<li class="${h.tagName === 'H3' ? 'sub' : ''}">${esc(h.innerText)}</li>`).join('') +
      `</ul></div>`;
  }

  pv.innerHTML = `${tagsHTML}<h1 class="atitle">${esc(displayTitle)}</h1>${tocHTML}<div class="nbody">${temp.innerHTML}</div>`;
  if (typeof hljs !== 'undefined') {
    pv.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
  }
};

const count = () => {
  const w = words(ta.value);
  const p = paras(ta.value);
  $('count').textContent = `${w} words • ${p} ${p === 1 ? 'para' : 'paras'} • ${mins(ta.value)} min read`;
};

const wipeLocal = () => { try { localStorage.removeItem(KEY); } catch (e) {} };

const mark = () => {
  dirty = true;
  count();
  updateOutlineMenu();
  $('auto').textContent = '• Unsaved changes';

// Smart Paste: Pasting a URL while text is highlighted turns it into [text](url)
ta.addEventListener('paste', e => {
  const s = ta.selectionStart, x = ta.selectionEnd;
  if (s === x) return;
  const clip = (e.clipboardData || window.clipboardData).getData('text').trim();
  if (/^https?:\/\/\S+$/i.test(clip)) {
    e.preventDefault();
    const sel = ta.value.slice(s, x);
    ta.setRangeText(`[${sel}](${clip})`, s, x, 'end');
    mark();
  }
});

const SHORT = { b: '**|**', i: '*|*', k: '[|](https://)' };
ta.addEventListener('keydown', e => {
  if (e.key === 'Tab') { e.preventDefault(); return wrap('  |'); }
  let k = e.key ? e.key.toLowerCase() : '';
  if ((e.ctrlKey || e.metaKey) && SHORT[k]) { e.preventDefault(); return wrap(SHORT[k]); }
  
  if (e.key !== 'Enter' || e.isComposing || e.shiftKey || e.ctrlKey || e.metaKey || e.altKey || ta.selectionStart !== ta.selectionEnd) return;
  const p = ta.selectionStart, ls = ta.value.lastIndexOf('\n', p - 1) + 1;
  const mMatch = ta.value.slice(ls, p).match(/^(\s*)(?:([-*])|(\d+)\.)\s+(.*)$/);
  if (!mMatch) return;
  e.preventDefault();
  if (mMatch[4]) {
    let bullet = mMatch[2] ? mMatch[2] : (parseInt(mMatch[3], 10) + 1) + '.';
    ta.setRangeText('\n' + mMatch[1] + bullet + ' ', p, p, 'end');
  } else ta.setRangeText('', ls, p, 'end');
  mark();
});

// Every essay and draft needs a link nobody else uses
// The address a published essay really has: the same rule the site build uses (older essays keep the clean slug)
let effMap = new Map();
const slugFor = (n, coll) => coll === 'drafts' ? (slugify(n.slug) || baseSlug(n)) : (effMap.get(n.id) || baseSlug(n));

function uniqueSlug(wanted, exceptId) {
  const used = new Set(['index']);
  data.notes.forEach(n => { if (n.id !== exceptId) used.add(slugFor(n, 'notes')); });
  data.drafts.forEach(n => { if (n.id !== exceptId && slugify(n.slug)) used.add(slugify(n.slug)); });
  let s = wanted, i = 2;
  while (used.has(s)) s = `${wanted}-${i++}`;
  return s;
}

async function save(kind) {
  if ($('pub').disabled) return;
  const d = formData(); d.content = d.content.trim();
  if (!d.title || !d.content) return toast('Add a title and content first.', 'error');

  const wanted = slugify(d.slug) || slugify(d.title) || 'essay';
  d.slug = uniqueSlug(wanted, cur ? cur.id : null);
  $('slug').value = d.slug;
  if (d.slug !== wanted) toast(`That link was already used, so this one is ${ESSAY_PATH}/${d.slug}`);

  const btns = [$('pub'), $('draft')]; btns.forEach(b => { b.disabled = true; });
  try {
    const t = serverTimestamp();
    if (kind === 'draft') {
      let id = (cur && cur.coll === 'drafts') ? cur.id : null;
      if (id) await updateDoc(doc(db, 'drafts', id), { ...d, updatedAt: t });
      else { const ref = await addDoc(collection(db, 'drafts'), { ...d, updatedAt: t }); id = ref.id; }
      dirty = false; clearTimeout(timer); wipeLocal(); $('auto').textContent = '• Saved to Drafts';
      editing('drafts', id, d.title); toast('Draft saved.');
    } else {
      if (cur && cur.coll === 'notes') {
        // Update in place. If the link changed, remember the old one so old links keep working.
        const old = data.notes.find(x => x.id === cur.id);
        const patch = { ...d, updatedAt: t };
        const oldSlug = old ? slugFor(old, 'notes') : '';
        if (oldSlug && oldSlug !== d.slug) patch.previousSlugs = arrayUnion(oldSlug);
        await updateDoc(doc(db, 'notes', cur.id), patch);
        toast('Essay updated.', '', view(d.slug));
      } else if (cur && cur.coll === 'drafts') {
        // Publish a draft under the SAME id, and keep its original date if it was published before
        const draft = data.drafts.find(x => x.id === cur.id) || {};
        const carry = { ...draft }; delete carry.id;
        const batch = writeBatch(db);
        batch.set(doc(db, 'notes', cur.id), { ...carry, ...d, createdAt: draft.createdAt || t, updatedAt: t });
        batch.delete(doc(db, 'drafts', cur.id));
        await batch.commit();
        toast('Published!', '', view(d.slug));
      } else {
        await addDoc(collection(db, 'notes'), { ...d, createdAt: t });
        toast('Published!', '', view(d.slug));
      }
      reset();
      autoDeploy();
    }
    loadNotes();
  } catch (e) { toast(errMsg(e), 'error'); } 
  finally { btns.forEach(b => { b.disabled = false; }); }
}

/* ---------- one-click deploy (GitHub Actions) ----------
   The public site (essay pages, sitemap, RSS) is rebuilt by a GitHub Action. This button, and
   the automatic run after publishing, ask GitHub to start it. The repository name and token
   are stored in THIS browser only (localStorage); they are never written to Firestore or the site. */
const DEP = { repo: 'deploy-repo', token: 'deploy-token', auto: 'deploy-auto', workflow: 'firebase-hosting-merge.yml' };
const dget = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
const dset = (k, v) => { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) {} };
const REPO_RE = /^[\w.-]+\/[\w.-]+$/;
const deployReady = () => REPO_RE.test(dget(DEP.repo)) && dget(DEP.token).length > 20;

async function triggerDeploy(quiet) {
  if (!deployReady()) { if (!quiet) toast('Set up one-click deploy first (gear icon).', 'error'); return false; }
  const repo = dget(DEP.repo);
  try {
    const res = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/${DEP.workflow}/dispatches`, {
      method: 'POST',
      headers: { 'Accept': 'application/vnd.github+json', 'Authorization': `Bearer ${dget(DEP.token)}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ ref: 'main' })
    });
    if (res.status === 204) {
      toast('Deploy started. The public site updates in about 2 minutes.', '', { label: 'Watch', fn: () => open(`https://github.com/${repo}/actions`, '_blank', 'noopener') });
      return true;
    }
    const why = res.status === 401 ? 'GitHub rejected the token. It may have expired.'
      : res.status === 403 ? 'The token is missing the "Actions: Read and write" permission for this repository.'
      : res.status === 404 ? 'Repository or workflow not found. Check the owner/name.'
      : res.status === 422 ? 'The workflow cannot be started by hand. Is workflow_dispatch in firebase-hosting-merge.yml?'
      : `GitHub answered ${res.status}.`;
    toast('Deploy did not start. ' + why, 'error');
  } catch (e) { toast('Could not reach GitHub. Check your connection.', 'error'); }
  return false;
}
const autoDeploy = () => { if (dget(DEP.auto) !== 'no') triggerDeploy(true); };

async function configureDeploy() {
  const r = await ask({
    title: 'One-click deploy',
    text: 'Needs the GitHub repository and a fine-grained token with "Actions: Read and write" on that one repository. Both stay in this browser only. Leave the repository empty to remove them.',
    ok: 'Save',
    fields: [
      { id: 'repo', label: 'GitHub repository (owner/name)', value: dget(DEP.repo) },
      { id: 'token', label: dget(DEP.token) ? 'GitHub token (empty keeps the saved one)' : 'GitHub token', type: 'password' },
      { id: 'auto', label: 'Deploy automatically after publishing? (yes or no)', value: dget(DEP.auto) || 'yes' }
    ]
  });
  if (!r) return;
  if (!r.repo) { dset(DEP.repo, ''); dset(DEP.token, ''); dset(DEP.auto, ''); toast('One-click deploy removed.'); return; }
  if (!REPO_RE.test(r.repo)) return toast('The repository must look like owner/name.', 'error');
  dset(DEP.repo, r.repo);
  if (r.token) dset(DEP.token, r.token);
  dset(DEP.auto, /^n/i.test(r.auto) ? 'no' : 'yes');
  toast(deployReady() ? 'Saved. Use "Deploy site" to try it.' : 'Saved, but a token is still needed.');
}

$('deploy-cfg').onclick = configureDeploy;
$('deploy-btn').onclick = async () => {
  if (!deployReady()) { await configureDeploy(); if (!deployReady()) return; }
  triggerDeploy(false);
};

}

$('readall').onclick = async () => {
  const unread = msgs.filter(m => !m.read);
  if (!unread.length) return;
  try {
    const batch = writeBatch(db);
    unread.forEach(m => batch.update(doc(db, 'messages', m.id), { read: true }));
    await batch.commit();
    loadMsgs();
  } catch (e) { toast(errMsg(e), 'error'); }
};
$('unonly').onclick = () => {
  onlyUnread = !onlyUnread;
  $('unonly').setAttribute('aria-pressed', onlyUnread);
  renderMsgs();
};
$('refresh').onclick = loadMsgs;
addEventListener('visibilitychange', () => { if (!document.hidden && auth.currentUser && Date.now() - msgsLoadedAt > 60000) loadMsgs(); });

/* ---------- list actions ---------- */
document.addEventListener('click', async e => {
  document.querySelectorAll('.dropdown[open], .outline-dropdown[open]').forEach(d => {
    if (!d.contains(e.target)) d.removeAttribute('open');
  });
  
  const b = e.target.closest('[data-act]'); if (!b) return;
  const dropdownParent = b.closest('.dropdown');
  if (dropdownParent) dropdownParent.removeAttribute('open');
  
  const act = b.dataset.act, coll = b.dataset.coll, id = b.dataset.id;
  try {
    if (act === 'edit') {
      const n = data[coll].find(x => x.id === id); if (!n) return;
      if (dirty) { const c = await ask({ title: 'Replace editor?', text: 'Unsaved edits will be lost.', ok: 'Replace', danger: true }); if (!c) return; }
      reset();
      $('title').value = n.title || '';
      ta.value = n.content || '';
      setTagsSelection(tagsOf(n));
      $('excerpt').value = n.excerpt || '';
      $('slug').value = slugFor(n, coll); slugTouched = true;
      editing(coll, id, n.title || 'Untitled');
      count(); updateOutlineMenu(); showTab('write');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      resizeTa();
    } else if (act === 'clone') {
      const n = data[coll].find(x => x.id === id); if (!n) return;
      const cloneObj = {
        title: `${n.title || 'Untitled'} (Copy)`,
        content: n.content || '',
        tag: tagsOf(n)[0] || DEFAULT_TAGS[0],
        tags: tagsOf(n),
        updatedAt: serverTimestamp()
      };
      await addDoc(collection(db, 'drafts'), cloneObj);
      toast('Cloned to Drafts.');
      loadNotes();
    } else if (act === 'del') {
      const n = data[coll].find(x => x.id === id); if (!n) return;
      const c = await ask({ title: coll === 'notes' ? 'Delete published essay?' : 'Delete draft?', text: coll === 'notes' ? 'It will be removed from your public site.' : '', ok: 'Delete', danger: true });
      if (!c) return;
      await deleteDoc(doc(db, coll, id)); if (cur && cur.id === id) reset();
      if (coll === 'notes') autoDeploy();
      const saved = Object.assign({}, n); delete saved.id;
      toast('Deleted.', '', { label: 'Undo', fn: async () => { try { await setDoc(doc(db, coll, id), saved); toast('Restored.'); loadNotes(); if (coll === 'notes') autoDeploy(); } catch (x) { toast(errMsg(x), 'error'); } } });
      loadNotes();
    } else if (act === 'unpub') {
      const n = data.notes.find(x => x.id === id); if (!n) return;
      const c = await ask({ title: 'Unpublish essay?', text: 'It will move back to Drafts.', ok: 'Unpublish' }); if (!c) return;
      // Same id, and the original date is kept (so publishing again restores the same link and date)
      const dObj = Object.assign({}, n); delete dObj.id; dObj.updatedAt = serverTimestamp(); dObj.slug = slugFor(n, 'notes');
      const batch = writeBatch(db);
      batch.set(doc(db, 'drafts', id), dObj);
      batch.delete(doc(db, 'notes', id));
      await batch.commit();
      if (cur && cur.id === id) reset(); toast('Unpublished to Drafts.'); loadNotes(); autoDeploy();
    } else if (act === 'link') {
      try { const n = data.notes.find(x => x.id === id); await navigator.clipboard.writeText(`${SITE.url}${ESSAY_PATH}/${encodeURIComponent(n ? slugFor(n, 'notes') : id)}`); toast('Link copied.'); } 
      catch (err) { toast('Failed to copy.', 'error'); }
    } else if (act === 'read') {
      await updateDoc(doc(db, 'messages', id), { read: b.dataset.v === '1' }); loadMsgs();
    } else if (act === 'mdel') {
      const c = await ask({ title: 'Delete message?', text: 'Cannot be undone.', ok: 'Delete', danger: true }); if (!c) return;
      await deleteDoc(doc(db, 'messages', id)); toast('Deleted.'); loadMsgs();
    }
  } catch (x) { toast(errMsg(x), 'error'); }
});

/* ---------- start ---------- */
onAuthStateChanged(auth, u => {
  $('boot').hidden = true;
  $('auth').hidden = (u !== null); $('app').hidden = (u === null);
  if (u) { loadNotes(); loadMsgs(); restoreLocal(); } 
  else $('pass').value = '';
});
count();
</script>
