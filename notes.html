    <script>
        (function() {
            try {
                const t = localStorage.getItem('theme');
                const isDark = t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches);
                if (isDark) {
                    document.documentElement.classList.add('dark-mode');
                    const meta = document.getElementById('theme-color-meta');
                    if (meta) meta.setAttribute('content', '#121212');
                }
            } catch (e) {}
        })();
    </script>

<body>
    <a class="skip-link" href="#main">Skip to content</a>

    <div id="progress-container" aria-hidden="true"><div id="progress-bar"></div></div>

    <nav class="top-nav" id="main-nav" aria-label="Site">
        <a href="/" class="back-link" id="back-link">
            <i class="fas fa-arrow-left" aria-hidden="true"></i> <span id="back-text">Home</span>
        </a>
        <button type="button" class="theme-toggle" id="dark-mode-toggle" aria-label="Dark mode" aria-pressed="false" title="Toggle theme">
            <i class="fas fa-sun" aria-hidden="true"></i>
            <i class="fas fa-moon" aria-hidden="true"></i>
        </button>
    </nav>

    <div id="lightbox" class="lightbox-overlay" role="dialog" aria-modal="true" aria-label="Image viewer" aria-hidden="true" tabindex="-1">
        <img id="lightbox-img" class="lightbox-img" alt="">
    </div>

    <button type="button" id="scroll-top" class="scroll-top-btn" aria-label="Scroll to top"><i class="fas fa-arrow-up" aria-hidden="true"></i></button>

    <main id="main">
        <!-- ALL NOTES -->
        <div class="main-wrapper" id="grid-view">
            <div class="page-header" id="page-header">
                <h1>Notes &amp; Essays</h1>
                <p>Making sense of geopolitics, defense, and the modern world.</p>
            </div>

            <div class="toolbar" id="toolbar" role="search">
                <div class="search-wrap">
                    <i class="fas fa-search" aria-hidden="true"></i>
                    <input type="search" class="note-search" id="note-search" placeholder="Search essays and notes..." aria-label="Search essays" autocomplete="off" enterkeyhint="search">
                    <span class="search-kbd" aria-hidden="true">/</span>
                </div>
                <div class="filter-bar" id="filter-bar" role="group" aria-label="Filter by topic"></div>
            </div>
            <p class="results-meta" id="results-meta" role="status" aria-live="polite"></p>

            <!-- The build replaces everything between these markers with the real essay cards. -->
            <div class="notes-grid" id="notes-list" aria-busy="true"><!--SSR:NOTES--><div class="skeleton-card" style="grid-column: 1 / -1; height: 240px;"></div><div class="skeleton-card"></div><div class="skeleton-card"></div><!--/SSR:NOTES--></div>
        </div>

        <!-- Fallback reader: only used for essays published since the last build -->
        <div class="reading-wrapper single-note" id="single-note"></div>
    </main>

    <div id="toast-container" role="status" aria-live="polite"></div>

    <!--SSR:NOTESJSON--><script type="application/json" id="ssr-notes">[]</script><!--/SSR:NOTESJSON-->
    <script type="module" src="/assets/notes.js"></script>
